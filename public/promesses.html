<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promesses de dons · Hasdé Tsion</title>
<meta name="description" content="Promesses de dons de la synagogue Hasdé Tsion. Promettez aujourd'hui, réglez au cours de l'année.">
<meta name="theme-color" content="#0a1633">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap">
<style>
/* Layout : nuit bleue profonde, halos lumineux, titres Montserrat très gras, étiquettes or espacées, cartes vitrées. */
:root{
  --night:#0a1633; --night-2:#102454; --glow:#3f6fc0; --ink:#f3f6fd; --muted:#a9b6d3; --faint:#7f8db0;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);
  --gold:#e8c56b; --gold-ink:#1a1405; --ok:#6fd3a0; --warn:#f1b36a; --err:#ff8a80;
  --f-display:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-he:"Frank Ruhl Libre", "David", "Times New Roman", serif;
  --paper:rgba(255,255,255,.06); --card:rgba(255,255,255,.06); --blue:#4d82e0; --blue-deep:#0d1d45;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;color:var(--ink);font:16px/1.65 var(--f-body);min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(60rem 40rem at 50% -10%, rgba(80,130,220,.45), transparent 60%),
    radial-gradient(40rem 30rem at 0% 55%, rgba(60,100,190,.25), transparent 60%),
    radial-gradient(40rem 30rem at 100% 85%, rgba(60,100,190,.22), transparent 60%),
    linear-gradient(180deg, var(--night-2), var(--night) 70%);
  background-attachment:fixed}
.living-bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;background:var(--night)}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(100%,1540px);margin:0 auto;padding-inline:clamp(22px,4vw,64px)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0}
.he{font-family:var(--f-he);direction:rtl;unicode-bidi:isolate}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.lines p{margin:0 0 10px}

/* En-tête */
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(5,13,32,.82),rgba(5,13,32,.34) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand img{width:160px;height:auto;object-fit:contain}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a1633;border-radius:999px;padding:7px 14px;font:700 13px var(--f-display);text-decoration:none}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#e5484d}

/* Bandeau promesse */
.notice{margin-top:8px;border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.notice svg{flex:none;color:var(--gold);margin-top:3px}
.notice strong{display:block;font-family:var(--f-display);font-weight:700;margin-bottom:2px}
.notice span{color:var(--muted)}

/* Héros */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(34px,5vw,66px) clamp(28px,4vw,48px)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .logo{order:-1;width:220px;margin:0 auto}}
.hero .he-title{text-align:left;font-size:clamp(26px,4.4vw,36px);color:var(--gold);margin:12px 0 2px}
.hero h1{font-size:clamp(44px,6.4vw,96px)}
.hero p.sub{color:var(--muted);font-size:18px;margin:14px 0 0;max-width:46ch}
.logo{width:clamp(260px,24vw,380px);max-width:100%;aspect-ratio:1967/800;object-fit:contain;filter:drop-shadow(0 18px 46px rgba(0,0,0,.38))}

/* Le chiffre */
.figure{border:1px solid var(--line);border-radius:28px;padding:clamp(28px,3vw,44px);margin-bottom:clamp(28px,3vw,42px);
  background:linear-gradient(135deg,rgba(66,112,214,.46),rgba(14,32,80,.68));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden}
.figure::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,197,107,.25),transparent 70%)}
.figure .big{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,14vw,128px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#c9d6f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.figure .big small{font-size:.42em;letter-spacing:0;margin-left:6px}
.figure .per{color:var(--muted);margin:6px 0 22px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative;z-index:1}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.fact{background:rgba(5,14,38,.4);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.fact b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;color:var(--gold)}
.fact span{font-size:13.5px;color:var(--muted);line-height:1.45;display:block}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,.85fr);gap:clamp(28px,4vw,56px);align-items:start;padding-bottom:52px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel-g{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:22px;padding:clamp(24px,2.4vw,34px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel-g + .panel-g{margin-top:18px}
.panel-g h2{font-size:24px;margin:8px 0 14px}
.panel-g .lines{color:#d7def0}
.engage .lines p{font-size:17px}
.blessing .he{font-size:21px;line-height:2;margin:10px 0 0;color:#f5ecd2}
.blessing details{margin-top:14px;color:var(--muted);font-size:14.5px}
.blessing summary{cursor:pointer;color:var(--gold);font-weight:600}
.blessing details p{margin:10px 0 0}

/* Formulaire */
.card{border:1px solid var(--line);background:rgba(13,29,69,.64);border-radius:22px;padding:clamp(24px,2.4vw,34px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
@media (min-width:861px){.card{position:sticky;top:84px}}
.card h2{font-size:26px;margin:8px 0 6px}
.card .lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(232,197,107,.1);border:1px solid rgba(232,197,107,.35);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.sum span{color:var(--muted);font-size:14px;line-height:1.35}
.sum b{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.legend{font-weight:600;font-size:14.5px}
.hint{font-size:13px;color:var(--faint);font-weight:400}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
select option{color:#0a1633}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;background:rgba(255,255,255,.09)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--f-display);border-radius:999px;padding:15px 20px;border:0;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--gold);color:var(--gold-ink);width:100%}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary[disabled]{opacity:.6;cursor:wait}
.btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn-gold{background:transparent;border:1px solid var(--line);color:var(--ink);width:100%}
.btn-gold:hover{border-color:var(--gold)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.small{font-size:13px;color:var(--faint);margin:10px 0 0}
.error{color:var(--err);font-weight:600;font-size:14.5px;margin:0 0 12px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.thanks{text-align:center}
.thanks .seal{width:84px;height:84px;margin:6px auto 14px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.thanks p{color:var(--muted);margin:0 0 14px}
.recap{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px;text-align:left;font-size:14.5px;font-variant-numeric:tabular-nums}

/* Liste des campagnes */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:48px}
.camp{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--glass);border-radius:22px;padding:22px}
.camp:hover{border-color:var(--gold)}
.camp .he{color:var(--gold);font-size:22px}
.camp h3{font-size:24px;margin:6px 0}
.camp p{color:var(--muted);margin:0 0 12px}
.camp span{font-weight:700;color:var(--gold)}

.wordmark{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,13vw,140px);letter-spacing:-.04em;line-height:.9;margin:20px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.05));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:18px 28px;color:var(--faint);font-size:13px}
footer a{color:var(--muted)}
.skeleton{color:var(--muted);padding-block:60px;text-align:center}
@media (max-width:1080px){.grid{grid-template-columns:minmax(0,1fr) minmax(360px,.9fr)}}
@media (max-width:860px){.wrap{padding-inline:20px}.hero{padding-top:30px}.hero h1{font-size:clamp(40px,13vw,68px)}.logo{width:220px}.figure{border-radius:22px}.grid{grid-template-columns:1fr}.card{position:static}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}

html.embed,html.embed body{background:transparent!important;min-height:0}
html.embed .living-bg,html.embed .grain,html.embed header.top{display:none!important}
html.embed main{padding-top:90px}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed');</script>
</head>
<body>
<canvas class="living-bg" id="livingBg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/__l5e/assets-v1/92927bf8-e062-4450-aabb-d8bceb2c0269/logo-hasde-white.png" alt="Hasdé Tsion"></a>
    <a class="chip" href="/">Horaires</a>
  </div>
</header>

<main id="app" class="wrap">
  <p class="skeleton">Chargement de la campagne…</p>
</main>

<footer>
  <div class="wrap">
    <span>Association Hassidim de Sion · 50 rue du Bois de Boulogne, 92200 Neuilly-sur-Seine</span>
    <a href="/">hasde-tsion.com</a>
  </div>
</footer>

<script>
/* ====== RÉGLAGE ======
   Collez ici l'URL de l'application Web Google Apps Script (se termine par /exec). */
const SCRIPT_URL = "";
/* ===================== */
const LOGO = "/__l5e/assets-v1/92927bf8-e062-4450-aabb-d8bceb2c0269/logo-hasde-white.png";
const BLESSING_HE = "מִי שֶׁבֵּרַךְ אֲבוֹתֵינוּ אַבְרָהָם יִצְחָק וְיַעֲקֹב, מֹשֶׁה וְאַהֲרֹן, דָּוִד וּשְׁלֹמֹה, הוּא יְבָרֵךְ אֶת כָּל הַנּוֹדְרִים וְהַנּוֹתְנִים לִצְדָקָה לְבֵית הַכְּנֶסֶת חַסְדֵּי צִיּוֹן. בִּשְׂכַר זֶה, הַקָּדוֹשׁ בָּרוּךְ הוּא יִשְׁמְרֵם וְיַצִּילֵם מִכָּל צָרָה וְצוּקָה וּמִכָּל נֶגַע וּמַחֲלָה, וְיִשְׁלַח בְּרָכָה וְהַצְלָחָה בְּכָל מַעֲשֵׂה יְדֵיהֶם, פַּרְנָסָה טוֹבָה וּבְרִיאוּת הַגּוּף, וְיִזְכּוּ לִרְאוֹת בָּנִים וּבְנֵי בָנִים עוֹסְקִים בַּתּוֹרָה וּבַמִּצְוֹת, וְתִהְיֶה לָהֶם שָׁנָה טוֹבָה וּמְתוּקָה. וְנֹאמַר אָמֵן.";
const BLESSING_FR = "Que Celui qui a béni nos pères Avraham, Its'hak et Yaakov, Moché et Aharon, David et Chelomo, bénisse tous ceux qui promettent et donnent à la synagogue Hasdé Tsion. Par ce mérite, que le Saint, béni soit-Il, les garde de toute épreuve et de toute maladie, qu'Il envoie bénédiction et réussite dans toutes leurs entreprises, une parnassa abondante et une pleine santé, qu'ils voient leurs enfants et petits-enfants attachés à la Torah et aux mitsvot, et que cette année leur soit bonne et douce. Et disons Amen.";
const DEFAULT_CAMPAIGNS = [{"slug": "birkat-hachana-5787", "title": "Birkat Hachana 5787", "titleHe": "בִּרְכַּת הַשָּׁנָה", "subtitle": "La bénédiction de l'année, à chaque ouverture du Hekhal", "intro": "En ce début d'année 5787, la communauté Hasdé Tsion vous invite à vous associer à la Birkat Hachana.\nVotre promesse fait vivre la synagogue tout au long de l'année.\nElle soutient les offices, l'étude de la Torah et l'entretien de notre maison.", "engagement": "À chaque ouverture du Hekhal, votre nom sera prononcé devant les Sifré Torah.\nNous appellerons sur vous et sur les vôtres la bénédiction, une parnassa large et une brioute complète.\nQue toutes vos entreprises soient couronnées de réussite.", "fixedAmount": 2600, "taxRate": 66, "cerfa": true, "deadlineNote": "Règlement possible jusqu'à Roch Hachana 5788.\nEn une fois ou en plusieurs fois, à votre convenance.", "helloasso": "https://www.helloasso.com/associations/hassidim-de-sion/evenements/birkat-hachana-5787", "active": true}];
const HELLOASSO_DEFAULT = "https://www.helloasso.com/associations/hassidim-de-sion/evenements/birkat-hachana-5787";
const app = document.getElementById("app");
const eur = n => new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n) + " €";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Une phrase par ligne : on coupe sur les retours à la ligne et après chaque point. */
const lines = t => String(t || "").split(/\n+|(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Þ«"])/).map(x => x.trim()).filter(Boolean).map(x => `<p>${esc(x)}</p>`).join("");

const NOTICE = `
  <div class="notice fade" role="note">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div class="lines">
      <strong>Promettre aujourd'hui, régler à votre rythme.</strong>
      <p><span>Aucun paiement n'est demandé à l'inscription.</span></p>
      <p><span>Votre promesse peut être honorée à tout moment au cours de l'année, en une ou plusieurs fois.</span></p>
    </div>
  </div>`;

function currentSlug(){
  return new URLSearchParams(location.search).get("c") || decodeURIComponent(location.hash.slice(1)) || "";
}

async function loadCampaigns(){
  if(!SCRIPT_URL) return DEFAULT_CAMPAIGNS;
  try{
    const r = await fetch(SCRIPT_URL);
    const d = await r.json();
    return (d.campaigns && d.campaigns.length) ? d.campaigns : DEFAULT_CAMPAIGNS;
  }catch{ return DEFAULT_CAMPAIGNS; }
}

async function boot(){
  const list = (await loadCampaigns()).map(c => ({blessingHe:BLESSING_HE, blessingFr:BLESSING_FR, ...c}));
  const slug = currentSlug();
  const c = list.find(x => x.slug === slug) || (list.length === 1 ? list[0] : null);
  if(c) return renderCampaign(c);
  renderList(list);
}

function renderList(list){
  app.innerHTML = NOTICE + `
    <section class="hero fade"><div><div class="eyebrow">Soutenir</div><h1>Nos campagnes en cours</h1>
      <p class="sub">Choisissez la campagne à laquelle vous souhaitez vous associer.</p></div>
      <img class="logo" src="${LOGO}" alt="Hasdé Tsion, 50 rue du Bois de Boulogne"></section>
    <div class="camps">${list.length ? list.map(c => `
      <a class="camp" href="?c=${encodeURIComponent(c.slug)}">
        ${c.titleHe ? `<div class="he" lang="he">${esc(c.titleHe)}</div>` : ""}
        <h3>${esc(c.title)}</h3><p>${esc(c.subtitle || "")}</p><span>Faire une promesse →</span>
      </a>`).join("") : `<p class="skeleton">Aucune campagne n'est ouverte pour le moment.</p>`}
    </div>`;
}

function renderCampaign(c){
  document.title = c.title + " · Hasdé Tsion";
  const pay = c.helloasso || HELLOASSO_DEFAULT;
  const fixed = +c.fixedAmount || 0, rate = +c.taxRate || 0;
  const net = Math.round(fixed * (1 - rate/100)), monthly = Math.round(fixed / 12);

  const figure = fixed ? `
    <section class="figure fade" aria-label="Montant du don">
      <div class="eyebrow">Don pour l'année</div>
      <div class="big">${new Intl.NumberFormat("fr-FR").format(fixed)}<small>€</small></div>
      <p class="per">Un don unique pour toute l'année 5787.</p>
      <div class="facts">
        ${rate ? `<div class="fact"><b>${eur(net)}</b><span>Coût réel après réduction d'impôt de ${rate} %.</span></div>` : ""}
        <div class="fact"><b>≈ ${eur(monthly)}</b><span>Par mois, si vous réglez en douze fois.</span></div>
        ${c.cerfa ? `<div class="fact"><b>CERFA</b><span>Reçu fiscal adressé pour chaque don.</span></div>` : ""}
      </div>
    </section>` : "";

  app.innerHTML = NOTICE + `
    <section class="hero fade">
      <div>
        <div class="eyebrow">Campagne de promesses</div>
        ${c.titleHe ? `<div class="he he-title" lang="he">${esc(c.titleHe)}</div>` : ""}
        <h1>${esc(c.title)}</h1>
        ${c.subtitle ? `<p class="sub">${esc(c.subtitle)}</p>` : ""}
      </div>
      <img class="logo" src="${LOGO}" alt="Hasdé Tsion, 50 rue du Bois de Boulogne">
    </section>
    <div class="top-blocks" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:clamp(28px,3vw,42px)">
        <section class="panel-g">
          <div class="eyebrow">La Birkat Hachana</div>
          <div class="lines" style="margin-top:12px">${lines(c.intro)}</div>
        </section>
        ${c.engagement ? `<section class="panel-g engage"><div class="eyebrow">À chaque ouverture du Hekhal</div><div class="lines" style="margin-top:12px">${lines(c.engagement)}</div></section>` : ""}
    </div>
    ${figure}
    <div class="grid">
      <div>
        ${c.blessingHe ? `
        <section class="panel-g blessing" aria-label="Bénédiction">
          <div class="eyebrow">Bénédiction des donateurs</div>
          <p class="he" lang="he">${esc(c.blessingHe)}</p>
          ${c.blessingFr ? `<details><summary>Lire la traduction</summary><div class="lines" style="margin-top:10px">${lines(c.blessingFr)}</div></details>` : ""}
        </section>` : ""}
        ${c.deadlineNote ? `<section class="panel-g"><div class="eyebrow">Calendrier</div><div class="lines" style="margin-top:12px">${lines(c.deadlineNote)}</div></section>` : ""}
      </div>

      <aside class="card" id="card">
        <form id="f" novalidate>
          <div class="eyebrow">Ma promesse</div>
          <h2>Je m'engage</h2>
          <p class="lead">Quelques informations suffisent.<br>Nous vous recontacterons pour convenir du règlement.</p>
          ${fixed ? `<div class="sum"><span>Don Birkat Hachana<br>${rate ? `soit ${eur(net)} après impôt` : "pour l'année"}</span><b>${eur(fixed)}</b></div>` : `
          <div class="field"><label for="amount">Montant de la promesse</label><input id="amount" name="amount" inputmode="numeric" placeholder="Montant en euros"></div>`}
          <p class="error" id="err" role="alert" hidden></p>

          <div class="field"><label for="name">Nom et prénom</label><input id="name" name="name" autocomplete="name" required></div>

          <div class="field">
            <label for="honoree">Nom(s) à citer à l'ouverture du Hekhal</label>
            <input id="honoree" name="honoree" placeholder="Ex. David ben Sarah et sa famille">
            <span class="hint">De préférence le nom hébraïque, suivi de celui de la mère.</span>
          </div>

          <div class="row2">
            <div class="field"><label for="phone">Téléphone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email"></div>
          </div>

          <div class="field">
            <label for="schedule">Règlement envisagé</label>
            <select id="schedule" name="schedule">
              <option>Au cours de l'année, à ma convenance</option>
              <option>En plusieurs fois au fil de l'année</option>
              <option>En une fois, dans le mois</option>
              <option>Avant Pessah 5787</option>
              <option>Avant Roch Hachana 5788</option>
            </select>
          </div>

          <div class="field">
            <label for="intention">Intention particulière <span class="hint">· facultatif</span></label>
            <textarea id="intention" name="intention" placeholder="Refoua chelema, zivoug, réussite d'un enfant, élévation de l'âme…"></textarea>
          </div>

          <div class="hp" aria-hidden="true"><label>Site web<input name="website" tabindex="-1" autocomplete="off"></label></div>

          <button class="btn btn-primary" id="submit" type="submit">Enregistrer ma promesse</button>
          <p class="small">Aucune donnée bancaire n'est demandée.<br>Vos informations restent réservées à l'administration de la synagogue.</p>

          <div class="or">ou</div>
          <a class="btn btn-gold" href="${esc(pay)}" target="_blank" rel="noopener">Régler dès maintenant sur HelloAsso ↗</a>
        </form>
      </aside>
    </div>`;
  wireForm(c, pay, fixed, net, rate);
}

function wireForm(c, pay, fixed, net, rate){
  const f = document.getElementById("f"), err = document.getElementById("err");
  const amount = document.getElementById("amount");
  if(amount) amount.addEventListener("input", () => amount.value = amount.value.replace(/[^\d]/g,""));
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(f));
    data.amount = fixed || +data.amount || 0;
    data.campaign = c.slug;
    const fail = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({block:"center",behavior:"smooth"}); };
    if(!data.amount) return fail("Merci d'indiquer un montant.");
    if(!data.name.trim()) return fail("Merci d'indiquer votre nom.");
    if(!data.phone.trim() && !data.email.trim()) return fail("Merci d'indiquer un téléphone ou un e-mail pour que nous puissions vous recontacter.");
    err.hidden = true;
    const btn = document.getElementById("submit"); btn.disabled = true; btn.textContent = "Enregistrement…";
    try{
      if(!SCRIPT_URL) throw new Error("Le registre des promesses n'est pas encore connecté. Merci de réessayer un peu plus tard.");
      const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"content-type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
      const res = await r.json();
      if(res.error) throw new Error(res.error);
      document.getElementById("card").innerHTML = `
        <div class="thanks fade">
          <div class="seal"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
          <div class="eyebrow">Promesse enregistrée</div>
          <h2 style="margin:8px 0 12px">Tizkou lemitsvot</h2>
          <p>Merci ${esc(data.name.trim().split(" ")[0])}.</p>
          <p>${data.honoree ? "Le nom indiqué sera cité" : "Votre nom sera cité"} à chaque ouverture du Hekhal.</p>
          <div class="recap"><strong>${eur(data.amount)}</strong> · ${esc(c.title)}${rate && fixed ? `<br>Soit ${eur(net)} après réduction d'impôt` : ""}<br>${esc(data.schedule)}${data.honoree ? `<br>Nom(s) à citer : ${esc(data.honoree)}` : ""}</div>
          <p>Vous pourrez régler quand vous le souhaitez au cours de l'année.</p>
          <p>Pour régler dès à présent :</p>
          <a class="btn btn-primary" href="${esc(pay)}" target="_blank" rel="noopener">Régler sur HelloAsso ↗</a>
          <p class="small"><a href="${location.pathname}${location.search}">Enregistrer une autre promesse</a></p>
        </div>`;
      document.getElementById("card").scrollIntoView({block:"start",behavior:"smooth"});
    }catch(ex){
      btn.disabled = false; btn.textContent = "Enregistrer ma promesse";
      fail(ex.message || "L'enregistrement a échoué. Merci de réessayer.");
    }
  });
}
boot();

/* Fond vivant partagé avec l'univers visuel du site. */
(function animateBackground(){
  const canvas = document.getElementById("livingBg");
  const ctx = canvas && canvas.getContext("2d");
  if(!canvas || !ctx) return;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pointer = {x:.5,y:.28,tx:.5,ty:.28};
  let width=1,height=1,frame=0;
  const fields = [
    {rgb:"92,157,235",radius:.58,sx:.00010,sy:.00012,x:.16,y:.28,alpha:.44},
    {rgb:"28,77,168",radius:.72,sx:.00007,sy:.00006,x:.82,y:.2,alpha:.48},
    {rgb:"65,130,225",radius:.52,sx:.00013,sy:.00009,x:.52,y:.78,alpha:.42},
    {rgb:"240,214,137",radius:.3,sx:.00008,sy:.00011,x:.76,y:.7,alpha:.15}
  ];
  function resize(){
    const scale=Math.min(devicePixelRatio||1,1.5);
    width=canvas.width=Math.max(1,innerWidth*scale);
    height=canvas.height=Math.max(1,innerHeight*scale);
  }
  function paint(t){
    pointer.x+=(pointer.tx-pointer.x)*.035;
    pointer.y+=(pointer.ty-pointer.y)*.035;
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="#050d20";
    ctx.fillRect(0,0,width,height);
    ctx.globalCompositeOperation="lighter";
    fields.forEach((field,index)=>{
      const x=(field.x+Math.sin(t*field.sx+index)*.2)*width;
      const y=(field.y+Math.cos(t*field.sy+index*1.7)*.18)*height;
      const radius=field.radius*Math.max(width,height);
      const glow=ctx.createRadialGradient(x,y,0,x,y,radius);
      glow.addColorStop(0,`rgba(${field.rgb},${field.alpha})`);
      glow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glow;
      ctx.fillRect(0,0,width,height);
    });
    const x=pointer.x*width,y=pointer.y*height,radius=.32*Math.max(width,height);
    const light=ctx.createRadialGradient(x,y,0,x,y,radius);
    light.addColorStop(0,"rgba(155,205,255,.22)");
    light.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=light;
    ctx.fillRect(0,0,width,height);
    if(!reduced) frame=requestAnimationFrame(paint);
  }
  function move(event){pointer.tx=event.clientX/innerWidth;pointer.ty=event.clientY/innerHeight}
  resize();
  addEventListener("resize",resize,{passive:true});
  addEventListener("pointermove",move,{passive:true});
  paint(0);
  addEventListener("pagehide",()=>cancelAnimationFrame(frame),{once:true});
})();
</script>
<script>
if(document.documentElement.classList.contains('embed')){
  const post=()=>parent.postMessage({promessesHeight:document.documentElement.scrollHeight},'*');
  new ResizeObserver(post).observe(document.body);addEventListener('load',post);post();setInterval(post,1000);
  document.querySelectorAll('a[href="/"]').forEach(a=>a.target='_top');
  addEventListener('wheel',e=>{if(e.ctrlKey)return;e.preventDefault();parent.postMessage({promessesWheel:e.deltaMode===1?e.deltaY*16:e.deltaY},'*');},{passive:false});
}
/* Révélation au défilement, même rendu que l'accueil (montée 50px, 1.2s, expo-out) */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const st=document.createElement('style');
  st.textContent='.fade{animation:none!important}.rv{opacity:0;transform:translateY(50px);transition:opacity 1.2s cubic-bezier(.16,1,.3,1),transform 1.2s cubic-bezier(.16,1,.3,1);will-change:opacity,transform}.rv.in{opacity:1;transform:none}';
  document.head.appendChild(st);
  const SEL='.notice,.hero,.figure,.panel-g,.card,.thanks';
  const embed=document.documentElement.classList.contains('embed');let top=0,vh=embed?0:innerHeight;
  setTimeout(()=>{if(embed&&!vh){vh=screen.height;check();}},2500);
  const check=()=>{
    document.querySelectorAll(SEL).forEach((el,i)=>{
      if(el.classList.contains('in'))return;
      if(!el.classList.contains('rv')){el.classList.add('rv');}
      const r=el.getBoundingClientRect();
      const y=(embed?top:0)+r.top;
      if(y<vh*0.9){el.style.transitionDelay=(Math.min(i,4)*0.08)+'s';requestAnimationFrame(()=>el.classList.add('in'));}
    });
  };
  addEventListener('message',e=>{const d=e.data;if(d&&typeof d.pTop==='number'){top=d.pTop;vh=d.vh;check();}});
  addEventListener('scroll',check,{passive:true});
  new MutationObserver(check).observe(document.body,{childList:true,subtree:true});
  check();setTimeout(check,300);
})();
</script>
